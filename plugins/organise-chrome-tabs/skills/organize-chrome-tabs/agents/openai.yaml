interface:
  display_name: "Organize Chrome Tabs"
  short_description: "AI-classified Chrome windows capped at 10 tabs"
  default_prompt: "Use $organize-chrome-tabs to classify my live tabs, keep each topic window at 10 tabs or fewer, preview the plan, and apply it safely with Tab Steward without reloading, activating, muting, or unmuting any tab."

dependencies:
  tools:
    - type: "mcp"
      value: "chrome-devtools"
      description: "Inspect live Chrome pages and call Tab Steward's preview-and-apply API from its dashboard"

policy:
  allow_implicit_invocation: true

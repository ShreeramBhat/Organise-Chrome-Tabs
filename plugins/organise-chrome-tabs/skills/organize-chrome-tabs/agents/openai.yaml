interface:
  display_name: "Organize Chrome Tabs"
  short_description: "Safely sort Chrome tabs into topic windows"
  default_prompt: "Use $organize-chrome-tabs to organize my Chrome tabs into topic-based windows without closing anything."

dependencies:
  tools:
    - type: "mcp"
      value: "chrome-devtools"
      description: "Inspect live Chrome pages and operate the Tab Steward extension dashboard"

policy:
  allow_implicit_invocation: true
